name: Publicacao editorial programada
on:
  schedule:
    - cron: '20 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar proxima leitura
        run: python automation/publicar.py
      - name: Salvar publicacao no repositorio
        run: |
          git config user.name "1 Minuto de Luz Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leituras/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publicar leitura editorial automatica"
            git push
          fi
