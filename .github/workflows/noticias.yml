name: Noticias verificadas sob demanda
on:
  push:
    paths:
      - 'automation/noticias.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar somente pautas revisadas
        run: python automation/publicar_noticias.py
      - name: Salvar paginas
        run: |
          git config user.name "1 Minuto de Luz Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leituras/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publicar noticias verificadas"
            git push
          fi
